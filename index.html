<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>CHECKY</title>
  <style>
    :root {
      --bg:#f7f7f5;
      --card:#fff;
      --text:#111;
      --muted:#777;
      --line:#e7e7e7;
      --radius:18px;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    }
    button {
      border:0; border-radius:14px; padding:12px 16px;
      font:inherit; cursor:pointer;
    }
    .dark { background:#111; color:#fff; }
    .light { background:#fff; border:1px solid var(--line); }
    header {
      position:sticky; top:0; z-index:5;
      background:rgba(247,247,245,.92); backdrop-filter:blur(16px);
      padding:18px 18px 12px;
      border-bottom:1px solid var(--line);
    }
    header h1 { margin:0; font-size:25px; }
    header p { margin:5px 0 0; color:var(--muted); font-size:13px; }
    main { max-width:900px; margin:auto; padding:18px; }
    .books,.chapters { display:grid; gap:12px; }
    .book,.chapter {
      background:var(--card); border:1px solid var(--line);
      border-radius:var(--radius); padding:18px;
    }
    .book { min-height:95px; text-align:left; }
    .book strong,.chapter strong { display:block; font-size:18px; }
    .book span,.chapter span { color:var(--muted); font-size:13px; display:block; margin-top:6px; }
    .back { margin-bottom:14px; }
    .item {
      background:var(--card); border:1px solid var(--line);
      border-radius:var(--radius); padding:18px; margin-bottom:12px;
    }
    .item h2 { font-size:19px; margin:0 0 16px; }
    .keywords,.content { margin-top:12px; padding:14px; border-radius:14px; background:#f1f1ef; }
    .keywords { color:#555; }
    .content { white-space:pre-wrap; line-height:1.7; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .score-row { display:flex; gap:8px; margin-top:14px; }
    .score-row button { flex:1; }
    .hidden { display:none; }
    .empty { padding:30px 10px; text-align:center; color:var(--muted); }
  </style>
</head>
<body>
<header>
  <h1>CHECKY</h1>
  <p>主动回忆 · 关键词提示 · 原文核对</p>
</header>
<main id="app"></main>

<script>
const app = document.getElementById("app");
let data = null;

async function loadData() {
  try {
    const res = await fetch("./data/checky-data.json?ts=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
    renderBooks();
  } catch (e) {
    app.innerHTML = `<div class="empty">题库数据还没有生成。<br>请先让 GitHub Actions 运行 build-data。</div>`;
  }
}

function renderBooks() {
  app.innerHTML = `
    <h2>选择册子</h2>
    <div class="books">
      ${data.books.map((b,i)=>`
        <button class="book" onclick="renderChapters(${i})">
          <strong>${escapeHtml(b.title)}</strong>
          <span>${b.chapters.length} 个章节</span>
        </button>`).join("")}
    </div>`;
}

function renderChapters(bookIndex) {
  const b = data.books[bookIndex];
  app.innerHTML = `
    <button class="light back" onclick="renderBooks()">← 返回</button>
    <h2>${escapeHtml(b.title)}</h2>
    <div class="chapters">
      ${b.chapters.map((c,i)=>`
        <button class="chapter" onclick="renderItems(${bookIndex},${i})">
          <strong>${escapeHtml(c.title)}</strong>
          <span>${c.items.length} 个知识点</span>
        </button>`).join("")}
    </div>`;
}

function renderItems(bookIndex, chapterIndex) {
  const b = data.books[bookIndex], c = b.chapters[chapterIndex];
  app.innerHTML = `
    <button class="light back" onclick="renderChapters(${bookIndex})">← 返回</button>
    <h2>${escapeHtml(c.title)}</h2>
    ${c.items.length ? c.items.map((item,i)=>itemCard(bookIndex,chapterIndex,i,item)).join("")
      : `<div class="empty">这个章节暂时没有识别到知识点。</div>`}`;
}

function itemCard(bookIndex, chapterIndex, itemIndex, item) {
  const key = `checky-score-${item.id}`;
  const history = JSON.parse(localStorage.getItem(key) || "[]");
  return `
    <section class="item">
      <h2>${escapeHtml(item.title)}</h2>
      <div class="actions">
        <button class="dark" onclick="toggle('kw-${item.id}')">显示关键词</button>
        <button class="light" onclick="toggle('ct-${item.id}')">展开原文</button>
      </div>
      <div id="kw-${item.id}" class="keywords hidden">
        ${item.keywords.map(escapeHtml).join("　·　")}
      </div>
      <div id="ct-${item.id}" class="content hidden">${escapeHtml(item.content || "暂无原文")}</div>
      <div class="score-row">
        <button class="light" onclick="score('${item.id}',1)">1 基本不会</button>
        <button class="light" onclick="score('${item.id}',2)">2 需要提示</button>
        <button class="dark" onclick="score('${item.id}',3)">3 基本完整</button>
      </div>
      <div style="margin-top:10px;color:#888;font-size:12px">
        ${history.length ? `历史：${history.map(x=>x.score).join(" → ")}` : "尚无评分记录"}
      </div>
    </section>`;
}

function score(id, value) {
  const key = `checky-score-${id}`;
  const history = JSON.parse(localStorage.getItem(key) || "[]");
  history.push({score:value, time:new Date().toISOString()});
  localStorage.setItem(key, JSON.stringify(history));
  alert("已记录：" + value);
}

function toggle(id) {
  document.getElementById(id).classList.toggle("hidden");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

loadData();
</script>
</body>
</html>
