<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHECKY</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f6f6f4;
  color:#171717;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}

button{
  font:inherit;
}

#app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:64px;
  background:#f6f6f4;
  border-bottom:1px solid #e5e5e2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.title{
  font-size:20px;
  font-weight:700;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#171717;
  color:white;
  font-size:24px;
  line-height:40px;
  padding:0;
  cursor:pointer;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px 16px 40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.card{
  background:white;
  border:1px solid #e7e7e4;
  border-radius:20px;
  padding:20px;
  min-height:130px;
  box-shadow:0 3px 14px rgba(0,0,0,.04);
  cursor:pointer;
}

.card:active{
  transform:scale(.985);
}

.card h2{
  margin:0 0 10px;
  font-size:18px;
}

.card p{
  margin:0;
  color:#777;
  font-size:14px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.item{
  background:white;
  border:1px solid #e7e7e4;
  border-radius:16px;
  padding:16px;
  cursor:pointer;
}

.item-title{
  font-weight:650;
  line-height:1.55;
}

.item-meta{
  color:#888;
  font-size:13px;
  margin-top:7px;
}

.study{
  background:white;
  border-radius:22px;
  padding:22px;
  box-shadow:0 3px 14px rgba(0,0,0,.04);
}

.study-label{
  font-size:13px;
  color:#888;
  margin-bottom:12px;
}

.question{
  font-size:22px;
  line-height:1.65;
  font-weight:700;
  margin-bottom:22px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:18px;
}

.btn{
  border:0;
  background:#171717;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  cursor:pointer;
}

.btn.secondary{
  background:#ededeb;
  color:#171717;
}

.answer-box{
  margin-top:15px;
  padding:17px;
  background:#f4f4f1;
  border-radius:16px;
  line-height:1.8;
  white-space:pre-wrap;
}

.keyword-box{
  margin-top:15px;
  padding:15px;
  background:#f8edf5;
  border-radius:16px;
  line-height:1.8;
}

.score{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.score button{
  flex:1;
  border:1px solid #ddd;
  background:white;
  border-radius:12px;
  padding:12px;
}

.nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:24px;
}

.nav button{
  flex:1;
}

.error{
  background:#fff0f0;
  border:1px solid #f0bcbc;
  padding:16px;
  border-radius:15px;
  line-height:1.7;
}

.loading{
  color:#888;
  padding:30px 0;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .question{
    font-size:20px;
  }
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const app = document.getElementById("app");

let DATA = null;
let currentBook = null;
let currentChapter = null;
let currentQuestionIndex = 0;

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function books(){
  return DATA?.books || DATA?.subjects || [];
}

function chapters(book){
  return book?.chapters || [];
}

function questions(chapter){
  return chapter?.questions || [];
}

function header(title, showClose=true){
  return `
    <div class="topbar">
      <div class="title">${esc(title)}</div>
      ${showClose ? `<button class="close" onclick="goBack()">×</button>` : ""}
    </div>
  `;
}

function home(){
  currentBook = null;
  currentChapter = null;

  app.innerHTML = `
    ${header("CHECKY",false)}
    <main>
      <div class="grid">
        ${books().map(book => `
          <div class="card" onclick="openBook('${esc(book.id)}')">
            <h2>${esc(book.name || book.title)}</h2>
            <p>
              ${book.chapterCount ?? chapters(book).length} 个章节
              · ${book.questionCount ?? questionsCount(book)} 个题目
            </p>
          </div>
        `).join("")}
      </div>
    </main>
  `;
}

function questionsCount(book){
  return chapters(book).reduce((n,c)=>{
    return n + questions(c).length;
  },0);
}

function openBook(id){
  currentBook = books().find(b=>b.id===id);
  if(!currentBook) return;

  currentChapter = null;

  app.innerHTML = `
    ${header(currentBook.name || currentBook.title)}
    <main>
      <div class="list">
        ${chapters(currentBook).map((chapter,i)=>`
          <div class="item" onclick="openChapter(${i})">
            <div class="item-title">${esc(chapter.name || chapter.title || "第"+(i+1)+"章")}</div>
            <div class="item-meta">
              ${chapter.questionCount ?? questions(chapter).length} 题
            </div>
          </div>
        `).join("")}
      </div>
    </main>
  `;
}

function openChapter(index){
  currentChapter = chapters(currentBook)[index];
  currentQuestionIndex = 0;

  const qs = questions(currentChapter);

  app.innerHTML = `
    ${header(currentChapter.name || currentChapter.title)}
    <main>
      ${
        qs.length
        ?
        `<div class="list">
          ${qs.map((q,i)=>`
            <div class="item" onclick="openQuestion(${i})">
              <div class="item-title">
                第 ${i+1} 题
              </div>
              <div class="item-meta">
                ${esc(q.shortTitle || "主动回忆题")}
              </div>
            </div>
          `).join("")}
        </div>`
        :
        `<div class="error">这个章节目前没有生成题目。</div>`
      }
    </main>
  `;
}

function openQuestion(index){
  currentQuestionIndex = index;
  renderQuestion();
}

function renderQuestion(){
  const qs = questions(currentChapter);

  if(!qs.length) return;

  const q = qs[currentQuestionIndex];

  app.innerHTML = `
    ${header("主动回忆")}
    <main>
      <div class="study">

        <div class="study-label">
          ${esc(currentBook.name || currentBook.title)}
          ·
          ${esc(currentChapter.name || currentChapter.title)}
          ·
          ${currentQuestionIndex+1}/${qs.length}
        </div>

        <div class="question">
          ${esc(q.question)}
        </div>

        <div class="actions">
          <button class="btn secondary" onclick="toggleKeyword()">
            显示关键词
          </button>

          <button class="btn secondary" onclick="toggleAnswer()">
            显示答案
          </button>
        </div>

        <div id="keyword" style="display:none"></div>
        <div id="answer" style="display:none"></div>

        <div class="score">
          <button onclick="score(1)">★ 不熟</button>
          <button onclick="score(2)">★★ 一般</button>
          <button onclick="score(3)">★★★ 熟练</button>
        </div>

        <div class="nav">
          <button class="btn secondary"
            onclick="prevQuestion()"
            ${currentQuestionIndex===0 ? "disabled" : ""}>
            ‹ 上一题
          </button>

          <button class="btn"
            onclick="nextQuestion()"
            ${currentQuestionIndex===qs.length-1 ? "disabled" : ""}>
            下一题 ›
          </button>
        </div>

      </div>
    </main>
  `;
}

function toggleKeyword(){
  const box = document.getElementById("keyword");
  const q = questions(currentChapter)[currentQuestionIndex];

  if(box.style.display==="none"){
    box.style.display="block";
    box.innerHTML = `
      <div class="keyword-box">
        <strong>关键词</strong><br>
        ${esc(q.keyword || "暂无关键词")}
      </div>
    `;
  }else{
    box.style.display="none";
  }
}

function toggleAnswer(){
  const box = document.getElementById("answer");
  const q = questions(currentChapter)[currentQuestionIndex];

  if(box.style.display==="none"){
    box.style.display="block";
    box.innerHTML = `
      <div class="answer-box">
        <strong>答案</strong><br>
        ${esc(q.answer || q.content || "暂无答案")}
      </div>
    `;
  }else{
    box.style.display="none";
  }
}

function prevQuestion(){
  if(currentQuestionIndex>0){
    currentQuestionIndex--;
    renderQuestion();
  }
}

function nextQuestion(){
  const qs = questions(currentChapter);

  if(currentQuestionIndex<qs.length-1){
    currentQuestionIndex++;
    renderQuestion();
  }
}

function score(value){
  const q = questions(currentChapter)[currentQuestionIndex];

  q.lastScore = value;

  try{
    const key = "checky_scores";
    const saved = JSON.parse(localStorage.getItem(key) || "{}");
    saved[q.id] = {
      score:value,
      time:Date.now()
    };
    localStorage.setItem(key,JSON.stringify(saved));
  }catch(e){}
}

function goBack(){
  if(currentQuestionIndex !== null && currentChapter){
    currentQuestionIndex = 0;
    openChapter(
      chapters(currentBook).indexOf(currentChapter)
    );
    return;
  }

  if(currentBook){
    home();
    return;
  }

  home();
}

async function load(){
  app.innerHTML = `
    ${header("CHECKY",false)}
    <main>
      <div class="loading">正在加载题库……</div>
    </main>
  `;

  try{
    const response = await fetch(
      "./data/checky-data.json?ts="+Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("题库文件加载失败："+response.status);
    }

    DATA = await response.json();

    home();
  }catch(error){
    app.innerHTML = `
      ${header("CHECKY",false)}
      <main>
        <div class="error">
          <strong>题库加载失败</strong><br><br>
          ${esc(error.message)}
        </div>
      </main>
    `;
  }
}

load();
</script>
</body>
</html>
