<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ee"><title>CHECKY · 主动回忆</title>
<style>
:root{--bg:#f7f3ee;--card:#fffdf9;--ink:#242321;--muted:#8b8780;--line:#e7e0d7;--soft:#eee8df;--accent:#6f6257}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:780px;margin:auto;min-height:100vh;padding:20px 16px 96px}button{font:inherit;border:0;cursor:pointer;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:27px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:3px}.icon{width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-size:20px}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:21px;margin-bottom:17px}.hero h1{font-size:26px;margin:0 0 7px}.hero p{color:var(--muted);line-height:1.7;margin:0;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:var(--soft);border-radius:16px;padding:12px}.stat b{font-size:21px}.stat small{display:block;color:var(--muted);margin-top:3px}.title{font-weight:800;font-size:15px;margin:20px 2px 9px}.book,.row,.knowledge{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0}.book{display:flex;align-items:center;gap:13px}.emoji{font-size:27px}.book strong{font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.hidden{display:none!important}.back{background:none;padding:6px 2px;color:var(--muted);font-size:14px}.crumb{font-size:12px;color:var(--muted);margin:5px 0 7px;line-height:1.5}.page-title{font-size:26px;margin:0 0 13px}.row{display:flex;justify-content:space-between;align-items:center}.row-main{min-width:0}.row strong{font-size:15px}.arrow{color:var(--muted);font-size:20px}.progress{height:5px;background:#e7e0d7;border-radius:99px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}.study{text-align:center}.study .page-title{margin-top:13px}.study-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:13px;text-align:left}.recall-tip{color:var(--muted);font-size:13px;line-height:1.7;text-align:center}.reveal{width:100%;background:var(--soft);border-radius:15px;padding:14px;margin-top:11px;text-align:left}.panel{position:relative;background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:11px;text-align:left;line-height:1.9}.panel h3{font-size:14px;margin:0 32px 8px 0}.panel p{margin:0;white-space:pre-wrap}.close{position:absolute;right:10px;top:9px;width:32px;height:32px;border-radius:50%;background:var(--soft);font-size:20px;line-height:1}.keyword-list{display:flex;flex-wrap:wrap;gap:7px}.kw{background:var(--soft);border-radius:999px;padding:6px 10px;font-size:12px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.score{padding:14px 5px;border:1px solid var(--line);background:var(--card);border-radius:16px;font-weight:800}.score small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:3px}.footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,243,238,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px max(16px,calc((100% - 780px)/2 + 16px));display:flex;gap:8px;z-index:10}.nav button{flex:1;padding:10px;border-radius:13px;background:transparent;color:var(--muted)}.nav .active{background:var(--ink);color:#fff}.empty{padding:25px;text-align:center;color:var(--muted)}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">CHECKY</div><div class="sub">大分类 → 小分类 → 知识点 → 提示词 → 原文</div></div><button class="icon" onclick="resetScores()">↺</button></header>
<section id="home"><div class="hero"><h1>今天，先想起来。</h1><p>进入知识点后，先合上书完整复述。想不起来再看提示词，最后才展开原文核对。标题不会直接显示答案。</p><div class="stats"><div class="stat"><b id="statItems">0</b><small>已练知识点</small></div><div class="stat"><b id="statAvg">—</b><small>平均掌握</small></div><div class="stat"><b id="statBooks">3</b><small>资料</small></div></div></div><div class="title">三本资料</div><div id="books"></div></section>
<section id="list" class="hidden"><button class="back" onclick="goHome()">‹ 返回资料</button><div class="crumb" id="listCrumb"></div><h1 class="page-title" id="listTitle"></h1><div id="listBody"></div></section>
<section id="study" class="hidden study"><button class="back" onclick="goList()">‹ 返回上一级</button><div class="crumb" id="studyCrumb"></div><h1 class="page-title" id="studyTitle"></h1><div class="study-card"><div class="recall-tip">先不要看下面内容。请先从标题把答案完整说出来。</div><button class="reveal" id="kwBtn" onclick="showKeywords()">💡 显示提示词</button><div id="keywordPanel" class="panel hidden"><button class="close" onclick="closePanel('keywordPanel','kwBtn')">×</button><h3>提示词</h3><div class="keyword-list" id="keywords"></div></div><button class="reveal" id="textBtn" onclick="showOriginal()">📖 还是想不起来 → 查看原文</button><div id="originalPanel" class="panel hidden"><button class="close" onclick="closePanel('originalPanel','textBtn')">×</button><h3>原文</h3><p id="original"></p></div><div class="scores"><button class="score" onclick="score(1)">1 分<small>基本不会</small></button><button class="score" onclick="score(2)">2 分<small>需提示</small></button><button class="score" onclick="score(3)">3 分<small>基本完整</small></button></div></div></section>
<section id="stats" class="hidden"><button class="back" onclick="goHome()">‹ 返回</button><h1 class="page-title">练习统计</h1><div id="statsBody"></div></section>
<div class="footer-note">题库内容来自你提供的三份 DOCX；水印 PUSH DESIGN / PUSH / DESIGN 已清除。</div></div><nav class="nav"><button id="nHome" class="active" onclick="goHome()">首页</button><button id="nStats" onclick="showStats()">统计</button></nav>
<script>
let DATA={books:[]},book=null,group=null,sub=null,itemIndex=0;const scoreKey='checky-v2-scores';let scores=JSON.parse(localStorage.getItem(scoreKey)||'{}');
const $=id=>document.getElementById(id),esc=s=>(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(scoreKey,JSON.stringify(scores))}
function allItems(){return DATA.books.flatMap(b=>b.groups.flatMap(g=>g.subs.flatMap(s=>s.items.map((x,i)=>({b,g,s,x,i,id:keyOf(b,g,s,i)})))))}
function keyOf(b,g,s,i){return b.id+'|'+g.title+'|'+s.title+'|'+i}
function renderHome(){$('books').innerHTML=DATA.books.map(b=>{let n=b.groups.reduce((a,g)=>a+g.subs.reduce((c,s)=>c+s.items.length,0),0);return `<button class="book" onclick="openBook('${esc(b.id)}')"><div class="emoji">${b.emoji}</div><div><strong>${esc(b.name)}</strong><div class="meta">${n} 个知识点 · ${b.groups.length} 个大分类</div></div></button>`}).join('');updateStats()}
function updateStats(){let vals=Object.values(scores).filter(x=>typeof x==='number');$('statItems').textContent=vals.length;$('statAvg').textContent=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/3*100)+'%':'—'}
function hideAll(){['home','list','study','stats'].forEach(id=>$(id).classList.add('hidden'));$('nHome').classList.remove('active');$('nStats').classList.remove('active')}
function goHome(){hideAll();$('home').classList.remove('hidden');$('nHome').classList.add('active');updateStats()}
function openBook(id){book=DATA.books.find(b=>b.id===id);hideAll();$('list').classList.remove('hidden');$('listCrumb').textContent=book.name;$('listTitle').textContent='选择大分类';renderGroups()}
function renderGroups(){$('listBody').innerHTML=book.groups.map((g,i)=>{let n=g.subs.reduce((a,s)=>a+s.items.length,0);return `<button class="row" onclick="openGroup(${i})"><div class="row-main"><strong>${esc(g.title)}</strong><div class="meta">${n} 个知识点 · ${g.subs.length} 个小分类</div></div><div class="arrow">›</div></button>`}).join('')}
function openGroup(i){group=book.groups[i];hideAll();$('list').classList.remove('hidden');$('listCrumb').textContent=book.name+' / '+group.title;$('listTitle').textContent='选择小分类';$('listBody').innerHTML=group.subs.map((s,j)=>`<button class="row" onclick="openSub(${j})"><div class="row-main"><strong>${esc(s.title)}</strong><div class="meta">${s.items.length} 个知识点</div><div class="progress"><i style="width:${subProgress(s)}%"></i></div></div><div class="arrow">›</div></button>`).join('')}
function subProgress(s){let vals=s.items.map((x,i)=>scores[keyOf(book,group,s,i)]).filter(v=>typeof v==='number');return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/3*100):0}
function openSub(i){sub=group.subs[i];hideAll();$('list').classList.remove('hidden');$('listCrumb').textContent=book.name+' / '+group.title+' / '+sub.title;$('listTitle').textContent='选择知识点';$('listBody').innerHTML=sub.items.map((x,j)=>`<button class="knowledge" onclick="openItem(${j})"><div><strong>${esc(x.title)}</strong><div class="meta">${scoreText(scores[keyOf(book,group,sub,j)])}</div></div></button>`).join('')}
function scoreText(v){return typeof v==='number'?`掌握 ${Math.round(v/3*100)}%`:'未练习'}
function openItem(i){itemIndex=i;let x=sub.items[i];hideAll();$('study').classList.remove('hidden');$('studyCrumb').textContent=book.name+' / '+group.title+' / '+sub.title;$('studyTitle').textContent=x.title;$('keywords').innerHTML=(x.keywords||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('')||'<span class="meta">暂无提示词</span>';$('original').textContent=x.original||'';$('keywordPanel').classList.add('hidden');$('originalPanel').classList.add('hidden');$('kwBtn').classList.remove('hidden');$('textBtn').classList.remove('hidden')}
function showKeywords(){$('keywordPanel').classList.remove('hidden');$('kwBtn').classList.add('hidden')}
function showOriginal(){$('originalPanel').classList.remove('hidden');$('textBtn').classList.add('hidden')}
function closePanel(panel,btn){$(panel).classList.add('hidden');$(btn).classList.remove('hidden')}
function score(n){scores[keyOf(book,group,sub,itemIndex)]=n;save();if(itemIndex<sub.items.length-1){openItem(itemIndex+1)}else{openSub(group.subs.indexOf(sub))}updateStats()}
function goList(){if(sub){openGroup(book.groups.indexOf(group))}else if(group){openBook(book.id)}else goHome()}
function showStats(){hideAll();$('stats').classList.remove('hidden');$('nStats').classList.add('active');let vals=Object.values(scores).filter(x=>typeof x==='number');let by={};allItems().forEach(o=>{if(typeof scores[o.id]==='number'){by[o.b.name]=(by[o.b.name]||[]).concat(scores[o.id])}});$('statsBody').innerHTML=`<div class="hero"><h2 style="margin:0 0 8px">总体</h2><p>已练 ${vals.length} 个知识点，平均掌握 ${vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/3*100):0}%。</p></div>`+Object.entries(by).map(([k,v])=>`<div class="row"><div><strong>${esc(k)}</strong><div class="meta">${v.length} 个已练 · 平均 ${Math.round(v.reduce((a,b)=>a+b,0)/v.length/3*100)}%</div></div></div>`).join('')||'<div class="empty">还没有练习记录。</div>'}
function resetScores(){if(confirm('确定清空 CHECKY 的本机练习记录吗？')){scores={};save();renderHome();goHome()}}
fetch('./checky-data.json?v=2').then(r=>r.json()).then(d=>{DATA=d;renderHome()}).catch(e=>{$('books').innerHTML='<div class="empty">题库加载失败，请确认 checky-data.json 与 index.html 在同一目录。</div>'});
</script></body></html>
